server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/promtail-positions.yaml

clients:
  - url: http://127.0.0.1:3100/loki/api/v1/push
    batchwait: 2s
    timeout: 30s
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 20

scrape_configs:
  - job_name: ai-chat-soul-events
    static_configs:
      - targets:
          - localhost
        labels:
          job: ai-chat-soul
          log_type: event
          host: cn-prod
          __path__: /home/ubuntu/workspace/ai-chat-soul/events.log
    pipeline_stages:
      - json:
          expressions:
            event:
            level:
            request_id:
            user_id:
            user_group:
            source:
            status:
            error_type:
            tool:
            latency_ms:
      - labels:
          event:
          level:
          source:
          status:
          error_type:
          tool:
      - timestamp:
          source: ts
          format: Unix

  - job_name: ai-chat-soul-runlog
    static_configs:
      - targets:
          - localhost
        labels:
          job: ai-chat-soul
          log_type: runlog
          host: cn-prod
          __path__: /home/ubuntu/workspace/ai-chat-soul/run.log
    pipeline_stages:
      - regex:
          expression: '^\[(?P<level>[A-Z]+)\]\[(?P<timestamp>[\d\-: ]+)\]\[[^\]]+\]\s-\s(?P<message>.*)$'
      - template:
          source: level
          template: '{{ ToLower .Value }}'
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: "2006-01-02 15:04:05"
          location: Asia/Shanghai
