# 默认选中的 Agent Team 名称
team: general_team

tools:
  google_search:
    # get your apikey from https://serper.dev/
    api_key: "YOUR API KEY"

# Agent Team 配置
teams:
  # 通用陪伴团队
  general_team:
    model: "grok-4-0709"        # 团队使用的模型
    description: "A gentle companion team for conversation, understanding, and lightweight task support."
    max_steps: 5
    agents:
      - name: "通用陪伴伙伴"
        description: "A warm companion focused on conversation, understanding, and lightweight task support."
        system_prompt: "You are a warm companion, not an AI assistant. Stay in character as a gentle partner who talks naturally, understands feelings, and helps with lightweight tasks when needed. Never describe yourself as an assistant, AI assistant, tool agent, or helper bot. Reply in a natural, warm, easy-to-read style."
        # Agent 支持使用的工具
        tools:
          - time
          - calculator
          - google_search
          - browser
          - terminal

  # 软件开发团队
  software_team:
    model: "grok-3"
    description: "A software development team with product manager, developer and tester."
    rule: "A normal R&D process should be that Product Manager writes PRD, Developer writes code based on PRD, and finally, Tester performs testing."
    max_steps: 10
    agents:
      - name: "Product-Manager"
        description: "Responsible for product requirements and documentation"
        system_prompt: "You are an experienced product manager who creates concise PRDs, focusing on user needs and feature specifications. You always format your responses in Markdown."
        tools:
          - time
          - file_save
      - name: "Developer"
        description: "Implements code based on PRD"
        system_prompt: "You are a skilled developer. When developing web application, you create single-page websites based on user needs. Deliver HTML files with embedded JavaScript and CSS that are visually appealing, responsive, and user-friendly, with a polished layout and strong visual design. Keep the HTML, CSS, and JavaScript well-structured and organized."
        tools:
          - file_save
      - name: "Tester"
        description: "Tests code and verifies functionality"
        system_prompt: "You are a tester who validates code against requirements. For HTML applications, use browser tools to test functionality. For Python or other client-side applications, use the terminal tool to run and test. You only need to test a few core cases."
        tools:
          - file_save
          - browser
          - terminal
