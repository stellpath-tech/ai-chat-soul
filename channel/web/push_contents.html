<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Push 文案管理</title>
  <link rel="stylesheet" href="/assets/css/admin.css">
  <link rel="stylesheet" href="/assets/css/push-contents.css">
</head>
<body>
  <section id="loginView" class="login-shell">
    <form id="loginForm" class="panel login-card">
      <p class="eyebrow">Push Console</p>
      <h1>Push 文案管理</h1>
      <p class="hero-copy">输入口令后进入后台。口令会保存在本机浏览器，后续进入页面会自动校验。</p>
      <label for="passcodeInput">管理员访问口令</label>
      <input id="passcodeInput" type="password" placeholder="输入访问口令" autocomplete="current-password" required>
      <a class="token-link" href="https://ecnhmcc1f7mq.feishu.cn/wiki/KIy6weNvniJsWxkAs0DcazMunRf" target="_blank" rel="noopener noreferrer">获取 token（访问口令）↗</a>
      <p class="muted">在文档中获取后台口令，两个管理后台通用。</p>
      <div class="login-actions"><button id="loginButton" class="button primary" type="submit">进入</button></div>
      <p id="loginError" class="error" role="alert"></p>
    </form>
  </section>

  <main id="appView" class="app-shell hidden">
    <nav class="admin-nav" aria-label="后台导航">
      <a href="/complaints">客诉浏览</a><a href="/push-contents" aria-current="page">Push 文案管理</a>
      <button id="logoutButton" class="button" type="button">退出登录</button>
    </nav>
    <section class="panel hero">
      <div>
        <p class="eyebrow">Push Console</p>
        <h1>Push 文案管理</h1>
        <p class="hero-copy">按发送时间、天气类型和召回节点，维护满仓的每一次主动问候。</p>
      </div>
      <div class="metric-card"><span id="metricLabel">当前分类</span><strong id="totalCount">—</strong><small id="statusSummary" class="muted">正在加载分类</small></div>
    </section>
    <div id="pageMessage" class="message hidden" role="status" aria-live="polite"></div>
    <button id="retryButton" class="button hidden" type="button">重新加载</button>
    <nav id="typeTabs" class="panel type-tabs" aria-label="消息类型"></nav>
    <div class="content-layout">
      <aside class="panel scene-panel">
        <h2 id="sceneHeading">发送时间段</h2>
        <p class="muted">数字为该分类文案总数</p>
        <nav id="sceneNav" aria-label="文案分类"></nav>
      </aside>
      <section class="panel content-panel">
        <div class="section-heading">
          <div><p id="categoryLabel" class="eyebrow"></p><h2 id="sceneTitle"></h2></div>
          <button id="newButton" class="button primary" type="button">新增文案</button>
        </div>
        <p id="sceneDescription" class="hero-copy"></p>
        <div class="filters">
          <label>文案状态<select id="enabledFilter"><option value="">全部状态</option><option value="true">启用</option><option value="false">停用</option></select></label>
          <label>搜索当前分类<input id="keywordFilter" type="search" placeholder="标题、正文或编号"></label>
          <button id="searchButton" class="button" type="button">查询</button>
        </div>
        <div id="contentRows" class="content-list" aria-live="polite"></div>
        <div class="pager">
          <span id="pageInfo"></span>
          <div><button id="prevButton" class="button" type="button">上一页</button> <button id="nextButton" class="button" type="button">下一页</button></div>
        </div>
      </section>
      <aside id="editorPanel" class="panel detail-panel editor-panel">
        <div id="emptyEditor" class="empty-state">选择一条文案查看详情，<br>或在当前分类中新增文案。</div>
        <div id="editorView" class="hidden">
          <form id="contentForm">
            <div class="detail-title"><h2 id="formTitle">新增文案</h2><span id="editState" class="pill"></span></div>
            <p id="editorContext" class="muted"></p>
            <fieldset id="editorFields">
              <div class="field"><label for="pushType">消息类型</label><select id="pushType" required></select></div>
              <div class="field"><label id="deliverySceneLabel" for="deliveryScene">发送时间段</label><select id="deliveryScene" required></select><p id="formSceneHint" class="field-hint"></p></div>
              <div class="field"><label for="title">标题</label><input id="title" required maxlength="255" placeholder="例如：早餐要热乎乎的"></div>
              <div class="field"><label for="body">正文</label><textarea id="body" required maxlength="2000" placeholder="写下满仓想对用户说的话"></textarea></div>
              <div class="field"><label for="contentNo">文案编号 <span class="muted">自动生成</span></label><input id="contentNo" readonly placeholder="保存后自动生成"></div>
              <label class="checkbox"><input id="enabled" type="checkbox" checked> 启用这条文案</label>
              <p id="ctaHint" class="field-hint"></p>
              <div class="editor-actions"><button id="saveButton" class="button primary" type="submit">保存文案</button><button id="disableButton" class="button danger hidden" type="button">停用</button><button id="cancelButton" class="button" type="button">取消编辑</button></div>
            </fieldset>
            <p id="formError" class="error" role="alert"></p>
          </form>
          <section class="detail-block">
            <h3>关联插图 <span id="imageCount" class="muted"></span></h3>
            <p class="muted">可关联多张图片，每次推送随机使用一张。</p>
            <div id="images" class="image-grid"></div>
            <div id="imageSection" class="hidden">
              <label class="field-hint" for="imageFile">PNG、JPG、WEBP · 每张不超过 10 MB · 可多选</label>
              <input id="imageFile" type="file" multiple accept="image/png,image/jpeg,image/webp">
              <button id="uploadButton" class="button" type="button">上传选中图片</button>
              <p id="uploadStatus" class="field-hint" role="status"></p>
            </div>
            <p id="saveFirstHint" class="muted">先保存文案，再添加插图。</p>
          </section>
        </div>
      </aside>
    </div>
  </main>
  <dialog id="imagePreview"><button id="closePreview" class="button" type="button">关闭预览</button><img id="previewImage" alt="文案插图预览"></dialog>
  <script src="/assets/js/admin-auth.js"></script>
  <script src="/assets/js/push-contents.js"></script>
</body>
</html>
