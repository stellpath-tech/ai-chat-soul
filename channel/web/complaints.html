<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客诉浏览</title>
  <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body>
  <section id="loginView" class="login-shell">
    <div class="panel login-card">
      <p class="eyebrow">Complaint Console</p>
      <h1>客诉浏览</h1>
      <p class="hero-copy">输入口令后进入后台。口令会保存在本机浏览器，后续进入页面会自动校验。</p>
      <div style="height: 18px"></div>
      <label for="passcodeInput">管理员访问口令</label>
      <input id="passcodeInput" type="password" placeholder="输入访问口令" autocomplete="current-password">
      <a class="token-link" href="https://ecnhmcc1f7mq.feishu.cn/wiki/KIy6weNvniJsWxkAs0DcazMunRf" target="_blank" rel="noopener noreferrer">获取 token（访问口令）↗</a>
      <p class="muted">在文档中获取后台口令，两个管理后台通用。</p>
      <div style="height: 10px"></div>
      <button id="loginButton" class="button primary" type="button">进入</button>
      <p id="loginError" class="error"></p>
    </div>
  </section>

  <main id="appView" class="app-shell hidden">
    <nav class="admin-nav" aria-label="后台导航">
      <a href="/complaints" aria-current="page">客诉浏览</a><a href="/push-contents">Push 文案管理</a>
      <button id="logoutButton" class="button" type="button">退出登录</button>
    </nav>
    <section class="panel hero">
      <div>
        <p class="eyebrow">Complaint Console</p>
        <h1>客诉浏览</h1>
        <p class="hero-copy">查看用户反馈，按内容搜索、按状态收敛处理队列，并为每条客诉追加多条处理 comment。</p>
      </div>
      <div class="metric-card">
        <span>当前结果</span>
        <strong id="totalCount">0</strong>
        <small class="muted" id="statusSummary">未标记 0 · 需要修复 0 · 已修复 0 · 无需修复 0</small>
      </div>
    </section>

    <section class="panel toolbar">
      <input id="keywordInput" placeholder="搜索客诉内容或联系方式">
      <select id="statusFilter">
        <option value="">全部状态</option>
        <option value="未标记">未标记</option>
        <option value="需要修复">需要修复</option>
        <option value="已修复">已修复</option>
        <option value="无需修复">无需修复</option>
      </select>
      <select id="orderSelect">
        <option value="desc">时间倒序</option>
        <option value="asc">时间正序</option>
      </select>
      <button id="refreshButton" class="button primary" type="button">查询</button>
    </section>

    <section class="layout">
      <div class="panel list-panel">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>状态</th>
                <th>内容</th>
                <th>联系方式</th>
                <th>类型</th>
                <th>评论</th>
                <th>时间</th>
              </tr>
            </thead>
            <tbody id="feedbackBody"></tbody>
          </table>
        </div>
        <div class="pager">
          <span id="pageInfo">第 1 页</span>
          <div>
            <button id="prevButton" class="button" type="button">上一页</button>
            <button id="nextButton" class="button" type="button">下一页</button>
          </div>
        </div>
      </div>

      <aside class="panel detail-panel">
        <div id="emptyDetail" class="muted">选择一条客诉查看详情。</div>
        <div id="detailView" class="hidden">
          <div class="detail-title">
            <h2 id="detailTitle">#</h2>
          </div>

          <div class="detail-block">
            <label>处理状态</label>
            <select id="detailStatus">
              <option value="未标记" disabled>未标记</option>
              <option value="需要修复">需要修复</option>
              <option value="已修复">已修复</option>
              <option value="无需修复">无需修复</option>
            </select>
          </div>

          <div class="detail-block">
            <label>客诉内容</label>
            <p id="detailDescription" class="desc"></p>
          </div>

          <div class="detail-block">
            <label>用户信息</label>
            <div class="meta-grid" id="detailMeta"></div>
          </div>

          <div class="detail-block">
            <label>图片</label>
            <div id="detailImages"></div>
          </div>

          <div class="detail-block">
            <label>Comments</label>
            <div id="commentList"></div>
            <textarea id="commentInput" placeholder="追加处理记录"></textarea>
            <div style="height: 8px"></div>
            <button id="commentButton" class="button primary" type="button">追加 Comment</button>
          </div>
        </div>
      </aside>
    </section>
  </main>

  <script src="/assets/js/admin-auth.js"></script>
  <script>
    const pageSize = 30;
    let passcode = '';
    let offset = 0;
    let selectedId = null;
    let currentItems = [];

    const $ = (id) => document.getElementById(id);

    function statusClass(status) {
      if (status === '未标记') return 'unmarked';
      if (status === '需要修复') return 'need';
      if (status === '已修复') return 'fixed';
      return 'none';
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    async function api(path, options = {}) {
      return AdminConsole.request(passcode, path, options);
    }

    async function verifyPasscode(candidate) {
      passcode = candidate;
      await AdminConsole.verify(candidate);
      $('loginView').classList.add('hidden');
      $('appView').classList.remove('hidden');
      await loadFeedbacks(true);
    }

    async function loadFeedbacks(reset = false) {
      if (reset) offset = 0;
      const params = new URLSearchParams({
        keyword: $('keywordInput').value.trim(),
        status: $('statusFilter').value,
        order: $('orderSelect').value,
        limit: String(pageSize),
        offset: String(offset),
      });
      const data = await api(`/api/admin/complaints?${params.toString()}`);
      currentItems = data.items || [];
      renderList(data);
      if (currentItems.length && !currentItems.some((item) => item.id === selectedId)) {
        selectFeedback(currentItems[0].id);
      } else if (!currentItems.length) {
        clearDetail();
      } else {
        selectFeedback(selectedId);
      }
    }

    function renderList(data) {
      $('totalCount').textContent = data.total || 0;
      const counts = data.statusCounts || {};
      $('statusSummary').textContent = `未标记 ${counts['未标记'] || 0} · 需要修复 ${counts['需要修复'] || 0} · 已修复 ${counts['已修复'] || 0} · 无需修复 ${counts['无需修复'] || 0}`;
      $('pageInfo').textContent = `第 ${Math.floor(offset / pageSize) + 1} 页 · ${offset + 1}-${offset + currentItems.length}`;
      $('prevButton').disabled = offset === 0;
      $('nextButton').disabled = offset + pageSize >= (data.total || 0);

      $('feedbackBody').innerHTML = currentItems.map((item) => `
        <tr class="feedback-row ${item.id === selectedId ? 'active' : ''}" data-id="${item.id}">
          <td>#${item.id}</td>
          <td><span class="pill ${statusClass(item.repairStatus)}">${escapeHtml(item.repairStatus)}</span></td>
          <td><div class="desc">${escapeHtml(item.description)}</div></td>
          <td>${escapeHtml(item.contact || item.phoneNumber || '-')}</td>
          <td>${escapeHtml(item.type || '-')}</td>
          <td>${item.commentCount || 0}</td>
          <td class="muted">${escapeHtml(item.createdAt)}</td>
        </tr>
      `).join('');

      document.querySelectorAll('.feedback-row').forEach((row) => {
        row.addEventListener('click', () => selectFeedback(Number(row.dataset.id)));
      });
    }

    function selectFeedback(id) {
      selectedId = id;
      const item = currentItems.find((row) => row.id === id);
      if (!item) return clearDetail();
      document.querySelectorAll('.feedback-row').forEach((row) => row.classList.toggle('active', Number(row.dataset.id) === id));
      $('emptyDetail').classList.add('hidden');
      $('detailView').classList.remove('hidden');
      $('detailTitle').textContent = `#${item.id}`;
      $('detailStatus').value = item.repairStatus;
      $('detailDescription').textContent = item.description;
      $('detailMeta').innerHTML = `
        <div class="meta-row"><span>用户</span><strong>${escapeHtml(item.userId)}</strong></div>
        <div class="meta-row"><span>手机号</span><strong>${escapeHtml(item.phoneNumber || '无手机号')}</strong></div>
        <div class="meta-row"><span>联系方式</span><strong>${escapeHtml(item.contact || '未填写')}</strong></div>
        <div class="meta-row"><span>提交时间</span><strong>${escapeHtml(item.createdAt)}</strong></div>
      `;
      renderImages(item.images || []);
      renderComments(item.comments || []);
    }

    function renderImages(images) {
      $('detailImages').innerHTML = images.length ? `
        <div class="image-grid">
          ${images.map((url) => `
            <a class="image-thumb" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">
              <img src="${escapeHtml(url)}" alt="客诉图片" loading="lazy">
            </a>
          `).join('')}
        </div>
      ` : '<p class="muted">暂无图片。</p>';
    }

    function renderComments(comments) {
      $('commentList').innerHTML = comments.length ? comments.map((comment) => `
        <div class="comment">
          <p>${escapeHtml(comment.content)}</p>
          <small>${escapeHtml(comment.createdAt)}</small>
        </div>
      `).join('') : '<p class="muted">暂无 comment。</p>';
    }

    function clearDetail() {
      selectedId = null;
      $('emptyDetail').classList.remove('hidden');
      $('detailView').classList.add('hidden');
    }

    async function updateStatus() {
      if (!selectedId) return;
      await api('/api/admin/complaints/status', {
        method: 'PUT',
        body: JSON.stringify({ feedbackId: selectedId, status: $('detailStatus').value }),
      });
      await loadFeedbacks(false);
    }

    async function addComment() {
      if (!selectedId) return;
      const content = $('commentInput').value.trim();
      if (!content) return;
      await api('/api/admin/complaints/comment', {
        method: 'POST',
        body: JSON.stringify({ feedbackId: selectedId, content }),
      });
      $('commentInput').value = '';
      await loadFeedbacks(false);
    }

    $('loginButton').addEventListener('click', async () => {
      $('loginError').textContent = '';
      try {
        await verifyPasscode($('passcodeInput').value.trim());
      } catch (error) {
        $('loginError').textContent = error.message;
      }
    });

    $('passcodeInput').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') $('loginButton').click();
    });
    $('refreshButton').addEventListener('click', () => loadFeedbacks(true));
    $('keywordInput').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') loadFeedbacks(true);
    });
    $('statusFilter').addEventListener('change', () => loadFeedbacks(true));
    $('orderSelect').addEventListener('change', () => loadFeedbacks(true));
    $('prevButton').addEventListener('click', () => {
      offset = Math.max(0, offset - pageSize);
      loadFeedbacks(false);
    });
    $('nextButton').addEventListener('click', () => {
      offset += pageSize;
      loadFeedbacks(false);
    });
    $('detailStatus').addEventListener('change', updateStatus);
    $('commentButton').addEventListener('click', addComment);
    $('logoutButton').addEventListener('click', () => {
      AdminConsole.clearPasscode();
      location.reload();
    });

    (async function boot() {
      const stored = AdminConsole.storedPasscode();
      if (!stored) return;
      try {
        await verifyPasscode(stored);
      } catch (error) {
        if (error.status === 401) AdminConsole.clearPasscode();
        $('loginError').textContent = error.message;
      }
    })();
  </script>
</body>
</html>
